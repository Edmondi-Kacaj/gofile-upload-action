name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit dist and retarget tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f dist/

          if git diff --staged --quiet; then
            echo "dist/ already up to date for ${{ github.ref_name }}"
          else
            git commit -m "chore: build dist for release ${{ github.ref_name }}"
            git tag -f "${{ github.ref_name }}"
            git push origin "refs/tags/${{ github.ref_name }}" --force
            # Optional — only if you want dist on master too:
            # git push origin "HEAD:refs/heads/master"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
